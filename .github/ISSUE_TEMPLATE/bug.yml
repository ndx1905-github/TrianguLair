name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happens, description: "And what should happen instead"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
  - type: input
    id: env
    attributes: {label: Device and version, placeholder: "iPhone 15, iOS 26, web build from …"}
