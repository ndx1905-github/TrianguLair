name: Task
description: A task from the spec breakdown (docs/TASKS.md)
title: "T-xxx — "
body:
  - type: textarea
    id: desc
    attributes: {label: Description, description: "What needs to be done, with a link to the spec section"}
    validations: {required: true}
  - type: textarea
    id: accept
    attributes: {label: Acceptance criteria, value: "- [ ] "}
    validations: {required: true}
  - type: input
    id: deps
    attributes: {label: Depends on}
