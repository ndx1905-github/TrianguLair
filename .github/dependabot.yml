# Dependabot (T-006): each package has its own lockfile, so each directory is listed.
# Minor and patch updates are grouped into one weekly PR per directory; majors come alone.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /packages/crypto
      - /packages/storage
      - /packages/data
      - /packages/osm
      - /packages/import
      - /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
