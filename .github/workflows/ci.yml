name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default (T-006).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: crypto
            test: test
          - package: storage
            # Real-server tests stay skipped (TL_REAL_SERVERS / TL_WEBDAV_URL unset).
            test: test
          - package: data
            # Without the performance suite (timings depend on the runner): npm run test:perf.
            test: test:ci
          - package: osm
            test: test
          - package: import
            test: test
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      # Each package has its own lockfile and installs on its own (no root workspace install).
      - run: npm ci --workspaces=false
      - run: npm run typecheck
      - run: npm run ${{ matrix.test }}

      # crypto: the committed test vectors must be exactly what the generator produces...
      - name: Test vectors are up to date
        if: matrix.package == 'crypto'
        run: |
          npm run vectors
          git diff --exit-code -- ../../docs/format/vectors
          test -z "$(git status --porcelain -- ../../docs/format/vectors)"
      # ...and the independent Python reference reader must agree with them.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.package == 'crypto'
        with:
          python-version: '3.12'
      - name: Python reference reader
        if: matrix.package == 'crypto'
        run: |
          python -m pip install pynacl
          npm run reader

  app:
    name: app (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # The app uses the workspace packages from their sources with its own node_modules.
      - run: npm ci --workspaces=false
      - run: npm run typecheck
      - run: npm test
      - name: Web export (fixture mode)
        run: npm run export:web:fixtures
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (T-119)
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report/
            apps/mobile/test-results/
          retention-days: 7
