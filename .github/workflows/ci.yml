name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default (T-006).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04 # pinned: the Playwright and real-server setups are tested there; ubuntu-latest moved to 26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: crypto
            test: test
          - package: storage
            # Real-server tests run in the "storage (real servers)" job (TL_WEBDAV_URL: by hand).
            test: test
          - package: data
            # Without the performance suite (timings depend on the runner): npm run test:perf.
            test: test:ci
          - package: osm
            test: test
          - package: import
            test: test
            # Imports @triangulair/data and @triangulair/osm from their sources: install their dependencies too.
            deps: data osm
          - package: sync
            # Without the performance suite; real-server tests run in the "storage (real servers)" job.
            test: test
            # Imports @triangulair/crypto, storage and data from their sources: install their dependencies too.
            deps: crypto storage data
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/*/package-lock.json
      # Each package has its own lockfile and installs on its own (no root workspace install).
      - run: npm ci --workspaces=false
      - name: Install the packages this one imports from source
        if: matrix.deps
        env:
          DEPS: ${{ matrix.deps }}
        run: for d in $DEPS; do (cd "../$d" && npm ci --workspaces=false); done
      - run: npm run typecheck
      - run: npm run ${{ matrix.test }}

      # crypto: the committed test vectors must be exactly what the generator produces...
      - name: Test vectors are up to date
        if: matrix.package == 'crypto'
        run: |
          npm run vectors
          git diff --exit-code -- ../../docs/format/vectors
          test -z "$(git status --porcelain -- ../../docs/format/vectors)"
      # ...and the independent Python reference reader must agree with them.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.package == 'crypto'
        with:
          python-version: '3.12'
      - name: Python reference reader
        if: matrix.package == 'crypto'
        run: |
          python -m pip install pynacl
          npm run reader

  # T-202: the storage conformance suite, the simulated failures and the sync scenarios against
  # real servers started on the runner by packages/storage/scripts/real-servers.sh: Apache httpd
  # mod_dav, WsgiDAV, moto (S3 API) and OpenSSH sftp. apt and pip only (no containers: MinIO no
  # longer publishes community images).
  real-servers:
    name: storage (real servers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/*/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Same versions as scripts/real-servers.sh, installed as the runner user.
      - name: Install moto and WsgiDAV
        run: python -m pip install "moto[server]==5.2.5" "wsgidav==4.4.1" "cheroot==11.1.2"
      - name: Start the real servers
        run: sudo env "PATH=$PATH" TL_PIP_INSTALL=0 bash packages/storage/scripts/real-servers.sh
      - name: Install the packages (storage, and what sync imports from source)
        run: for d in storage crypto data sync; do (cd "packages/$d" && npm ci --workspaces=false); done
      - name: Storage conformance and failures on real servers
        working-directory: packages/storage
        env:
          TL_REAL_SERVERS: '1'
        run: npx vitest run test/integration
      - name: Sync scenarios on real servers
        working-directory: packages/sync
        run: npm run test:real
      - name: Server logs
        if: failure()
        run: sudo tail -n 100 /tmp/wsgidav.log /tmp/moto.log /var/log/apache2/error.log || true

  app:
    name: app (mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # The app uses the workspace packages from their sources with its own node_modules.
      - run: npm ci --workspaces=false
      - run: npm run typecheck
      - run: npm test
      # The JavaScript bundles of the phone apps (Metro + Hermes bytecode). Catches
      # modules that resolve on the web but not on a phone, without a native build.
      - name: Native bundles (Android, iOS)
        run: |
          npx expo export --platform android --output-dir /tmp/native-android
          npx expo export --platform ios --output-dir /tmp/native-ios
      - name: Web export (fixture mode)
        run: npm run export:web:fixtures
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (T-119)
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report/
            apps/mobile/test-results/
          retention-days: 7
