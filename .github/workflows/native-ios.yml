name: Native iOS build

# Manual only (plus version tags): macOS minutes are scarce on a private repo
# (GitHub bills them 10x, ~200 macOS minutes/month on the free plan).
# Actions › "Native iOS build" › Run workflow. See docs/run-on-iphone.md.
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'What to build'
        type: choice
        options:
          - ipa
          - simulator
          - both
        default: ipa
      bundle_id:
        description: 'Bundle identifier (empty: org.triangulair.app.dev; Sideloadly can change it anyway)'
        type: string
        required: false
        default: ''
      xcode:
        description: 'Xcode version to select, e.g. 26.1 (empty: newest stable on the runner)'
        type: string
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Tag pushes have no inputs: build the sideloadable .ipa.
  BUILD: ${{ inputs.build || 'ipa' }}
  # Free Apple ID friendly config (no Associated Domains, own bundle id), see app.config.js.
  TL_FREE_SIGNING: '1'
  TL_IOS_BUNDLE_ID: ${{ inputs.bundle_id }}
  EXPO_NO_TELEMETRY: '1'
  CI: '1'

jobs:
  ios:
    name: iOS (${{ inputs.build || 'ipa' }})
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE: ${{ inputs.xcode }}
        run: |
          if [ -n "$XCODE" ]; then
            app="/Applications/Xcode_${XCODE}.app"
          else
            app=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' \
              | { grep -viE 'beta|release_candidate|_rc' || true; } | sort -V | tail -n 1)
          fi
          test -d "$app" || { echo "::error::Xcode not found: $app"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # Metro resolves the workspace packages' dependencies from apps/mobile/node_modules
      # (see metro.config.js), so packages/* need no install of their own.
      - run: npm ci --workspaces=false

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      # Restored after prebuild (which wipes ios/); saved at the end of the job.
      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        working-directory: apps/mobile/ios
        run: pod install

      - name: Find workspace and scheme
        id: project
        run: |
          ws=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          test -n "$ws" || { echo "::error::No .xcworkspace in ios/"; exit 1; }
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"
          echo "scheme=$(basename "$ws" .xcworkspace)" >> "$GITHUB_OUTPUT"

      # A: compile check for the Simulator (Debug, dev client), no signing.
      - name: Build for the iOS Simulator
        if: env.BUILD == 'simulator' || env.BUILD == 'both'
        env:
          WORKSPACE: ${{ steps.project.outputs.workspace }}
          SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          mkdir -p build
          if ! xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild-sim.log 2>&1; then
            grep -E ': error:|^error:' build/xcodebuild-sim.log | head -n 50 || true
            tail -n 80 build/xcodebuild-sim.log
            exit 1
          fi
          tail -n 3 build/xcodebuild-sim.log
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/apps/mobile/build/TrianguLair-simulator.zip" ./*.app)

      # B: unsigned device build (Release, JS bundle embedded) packaged as an .ipa;
      # Sideloadly / AltStore sign it with your Apple ID when installing.
      - name: Build for iPhone (unsigned .ipa)
        if: env.BUILD == 'ipa' || env.BUILD == 'both'
        env:
          WORKSPACE: ${{ steps.project.outputs.workspace }}
          SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          mkdir -p build
          if ! xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild-device.log 2>&1; then
            grep -E ': error:|^error:' build/xcodebuild-device.log | head -n 50 || true
            tail -n 80 build/xcodebuild-device.log
            exit 1
          fi
          tail -n 3 build/xcodebuild-device.log
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/device/Build/Products/Release-iphoneos/*.app build/Payload/
          (cd build && zip -qry TrianguLair-unsigned.ipa Payload)
          ls -lh build/TrianguLair-unsigned.ipa

      - name: Upload the .ipa
        if: env.BUILD == 'ipa' || env.BUILD == 'both'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrianguLair-ios-ipa-${{ github.sha }}
          path: apps/mobile/build/TrianguLair-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Simulator app
        if: env.BUILD == 'simulator' || env.BUILD == 'both'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrianguLair-ios-simulator-${{ github.sha }}
          path: apps/mobile/build/TrianguLair-simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-logs-${{ github.run_id }}
          path: apps/mobile/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7
