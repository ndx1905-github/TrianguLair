# Smoke test of the release APK on an Android emulator (see .github/workflows/native-android.yml
# and scripts/android-smoke.sh): the QR scanner opens, first launch with the location, "center on
# me", add a place by hand, see it on the map and in the list.
# Selectors are the components' testID (Maestro's `id` on Android).
# The emulator is an AOSP image without Google APIs, and android-smoke.sh sends it a GPS position
# (48.85837, 2.29448) every 2 s: finding it proves that location needs no Google Play services.
appId: org.triangulair.app
name: First launch, center on me, add a place, see it
env:
  PLACE: Smoke Test Cafe
  # The mock position as the add form shows it ("At 48.85837, 2.29448"), to 3 decimals (~100 m).
  HERE: .*48\.858\d*, 2\.294\d*.*
---
- launchApp:
    clearState: true
    stopApp: true
# A system app's "isn't responding" dialog (slow emulator), if one is still shown.
- runFlow:
    when:
      visible: .*isn't responding.*
    commands:
      - tapOn: Wait

# Welcome screen: the JS bundle loaded, the database opened and the router rendered.
- extendedWaitUntil:
    visible:
      id: welcome-start
    timeout: 90000
- takeScreenshot: 01-welcome

# The QR scanner (modules/tl-qr-scanner: CameraX + ZXing, no ML Kit) loads and opens the camera,
# or says that there is none; either way the app does not crash. "I already have my places" › QR.
- tapOn:
    id: welcome-device
- extendedWaitUntil:
    visible:
      id: device-qr
    timeout: 20000
- tapOn:
    id: device-qr
- extendedWaitUntil:
    visible:
      id: device-qr-showing
    timeout: 60000
- scrollUntilVisible:
    element:
      id: device-qr-scan-start
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-qr-scan-start
# The preview is a square as wide as the screen: "Stop" may be below it.
- scrollUntilVisible:
    element:
      id: device-qr-scan-(stop|unavailable)
    direction: DOWN
    timeout: 30000
- takeScreenshot: 01b-qr-scanner
- runFlow:
    when:
      visible:
        id: device-qr-scan-stop
    commands:
      - tapOn:
          id: device-qr-scan-stop
- scrollUntilVisible:
    element:
      id: device-back
    direction: DOWN
    timeout: 20000
- tapOn:
    id: device-back
- extendedWaitUntil:
    visible:
      id: device-qr
    timeout: 20000
- tapOn:
    id: device-back
- extendedWaitUntil:
    visible:
      id: welcome-start
    timeout: 20000
- tapOn:
    id: welcome-start

# Profile: the keys are made in the background (libsodium) before Continue does anything.
- extendedWaitUntil:
    visible:
      id: welcome-profile
    timeout: 20000
- tapOn:
    id: profile-name
- inputText: Smoke
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: keys-ready
    timeout: 60000
- takeScreenshot: 02-profile
- tapOn:
    id: profile-continue

# App lock, location, import: not now.
- extendedWaitUntil:
    visible:
      id: welcome-lock
    timeout: 30000
- takeScreenshot: 03-lock
- tapOn:
    id: lock-skip
- extendedWaitUntil:
    visible:
      id: welcome-location
    timeout: 20000
# Location: allowed (adb install -g granted the permission), the position is found and the
# step goes on by itself (on failure it would stay, with a "Location is off" banner).
- tapOn:
    id: location-allow
- extendedWaitUntil:
    visible:
      id: welcome-import
    timeout: 45000
- tapOn:
    id: import-later

# Map.
- extendedWaitUntil:
    visible:
      id: open-add
    timeout: 30000
- runFlow:
    when:
      visible:
        id: hint-dismiss
    commands:
      - tapOn:
          id: hint-dismiss
- takeScreenshot: 04-map-empty

# "Center on me": move the map away, then back to the position (modules/tl-location). The
# recovery-kit card and the filters are folded first, so that the swipe moves the map.
- runFlow:
    when:
      visible:
        id: protect-later
    commands:
      - tapOn:
          id: protect-later
- runFlow:
    when:
      visible:
        id: filter-panel
    commands:
      - tapOn:
          id: filter-toggle
- swipe:
    start: 65%, 55%
    end: 20%, 72%
    duration: 800
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: locate-me
- extendedWaitUntil:
    visible:
      id: locate-me
      enabled: true
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: locate-notice
- takeScreenshot: 04b-map-centered

# Add a place by hand at the map's center (no network needed): the center is the position.
- tapOn:
    id: open-add
- extendedWaitUntil:
    visible:
      id: drop-point
    timeout: 20000
- tapOn:
    id: drop-point
- extendedWaitUntil:
    visible:
      id: manual-name
    timeout: 20000
- assertVisible: ${HERE}
- tapOn:
    id: manual-name
- inputText: ${PLACE}
- hideKeyboard
- takeScreenshot: 05-add-form
- scrollUntilVisible:
    element:
      id: save-place
    direction: DOWN
    timeout: 20000
- tapOn:
    id: save-place

# Back on the map with the new place's card.
- extendedWaitUntil:
    visible:
      id: place-card
    timeout: 20000
- assertVisible: ${PLACE}
- takeScreenshot: 06-map-card
- tapOn:
    id: card-close
- extendedWaitUntil:
    notVisible:
      id: place-card
    timeout: 10000
# Its pin is on the map: the camera is centred on the new place, so tapping just above the
# centre (the pin's tip is on the coordinate) opens its card again. Markers are not in the
# accessibility tree, hence the point. Filters and the recovery-kit card are folded first.
- runFlow:
    when:
      visible:
        id: protect-later
    commands:
      - tapOn:
          id: protect-later
- runFlow:
    when:
      visible:
        id: filter-panel
    commands:
      - tapOn:
          id: filter-toggle
- takeScreenshot: 07-map-pin
- tapOn:
    point: 50%,48%
- extendedWaitUntil:
    visible:
      id: place-card
    timeout: 10000
- assertVisible: ${PLACE}
- tapOn:
    id: card-close
- extendedWaitUntil:
    notVisible:
      id: place-card
    timeout: 10000

# List: the place is there.
- tapOn:
    id: open-list
- extendedWaitUntil:
    visible:
      id: place-list
    timeout: 20000
- assertVisible:
    id: row-${PLACE}
- takeScreenshot: 08-list
# The search (accent folding, Unicode regular expressions) finds it.
- tapOn:
    id: list-search
- inputText: smoke
- hideKeyboard
- assertVisible:
    id: row-${PLACE}

# Still there after a cold start (saved to the encrypted database).
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: open-list
    timeout: 90000
- tapOn:
    id: open-list
- extendedWaitUntil:
    visible:
      id: row-${PLACE}
    timeout: 20000
- takeScreenshot: 09-list-after-restart
